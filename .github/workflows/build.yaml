name: Build

on:
  push:
    branches: [master]
    tags: ['[0-9]*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Europe/Berlin

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Build
        run: bash build.sh Release full

      - name: Package release archives
        if: startsWith(github.ref, 'refs/tags/')
        id: package
        run: |
          set -euo pipefail
          bash release.sh
          mapfile -t archives < <(find bin/Release -maxdepth 1 -name '*.zip' -printf '%f\n' | sort)
          printf 'archives<<EOF\n%s\nEOF\n' "$(printf '%s\n' "${archives[@]}")" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          ARCHIVES: ${{ steps.package.outputs.archives }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          title="$(date +%Y-%m-%d)"
          mapfile -t archives <<< "$ARCHIVES"
          archive_paths=()
          for a in "${archives[@]}"; do
            archive_paths+=("bin/Release/$a")
          done

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title"
            gh release upload "$tag" "${archive_paths[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${archive_paths[@]}" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "" --prerelease
          fi
